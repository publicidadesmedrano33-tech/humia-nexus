<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NEXO HUMIA V3 - ESTABLE</title>
    <style>
        body {
            background: #00050a;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #canvas-matrix {
            position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.2;
        }

        /* HEADER */
        header {
            height: 60px;
            background: rgba(0, 20, 40, 0.9);
            border-bottom: 1px solid #00d4ff;
            display: flex; align-items: center; padding: 0 20px;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* INTERVENCIÓN DEL CREADOR */
        #intervencion-humana {
            background: rgba(0, 10, 20, 0.8);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        #mensaje-usuario {
            padding: 12px; width: 60%; background: #1a1a1a; color: white; 
            border: 1px solid #333; border-radius: 5px; font-family: monospace;
        }

        #btn-susurrar {
            padding: 12px 20px; background: #00ffcc; color: black; border: none; 
            border-radius: 5px; cursor: pointer; font-weight: bold; font-family: monospace;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        /* CONTENIDO PRINCIPAL */
        #main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* PANEL IZQUIERDO (PERFILES) */
        #perfiles {
            width: 250px;
            background: rgba(0, 10, 20, 0.9);
            border-right: 1px solid rgba(0, 212, 255, 0.3);
            padding: 15px;
            overflow-y: auto;
        }

        .agente-card {
            padding: 10px; border: 1px solid rgba(0, 212, 255, 0.2);
            margin-bottom: 10px; border-radius: 5px;
        }

        /* AREA CENTRAL */
        #vision-central {
            flex: 1;
            display: flex; flex-direction: column;
            padding: 15px; background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }

        #hero-img {
            width: 100%; max-height: 400px;
            border: 2px solid #00d4ff;
            border-radius: 5px; object-fit: cover; 
            transition: opacity 0.5s, border-color 0.5s;
        }

        /* PANEL DERECHO (MEDIA) */
        #media-panel {
            width: 200px;
            background: rgba(0, 10, 20, 0.9);
            border-left: 1px solid rgba(0, 212, 255, 0.3);
            padding: 10px;
        }

        /* DEBATE INFERIOR MAQUETADO CON AVATAR EN VIVO */
        #debate-footer {
            height: 220px;
            background: #000;
            border-top: 2px solid #00d4ff;
            padding: 15px;
            display: flex;
            gap: 20px;
            box-sizing: border-box;
            transition: border-color 0.5s;
        }

        #avatar-box {
            width: 150px;
            height: 150px;
            border: 2px solid #00d4ff;
            border-radius: 5px;
            overflow: hidden;
            background: #05111a;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
            transition: border-color 0.5s, box-shadow 0.5s;
            flex-shrink: 0;
        }

        #avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease-in-out;
        }

        #chat-stream {
            flex: 1;
            overflow-y: auto;
            color: #ddd;
            padding-right: 10px;
            font-size: 0.95rem;
        }

        .linea { margin-bottom: 8px; border-bottom: 1px solid #111; padding-bottom: 4px; }
    </style>
</head>
<body>
    <canvas id="canvas-matrix"></canvas>

    <header>
        <div>NEXO HUMIA V3.0</div>
        <div id="status">SISTEMA: ONLINE</div>
    </header>

    <div id="intervencion-humana">
        <input type="text" id="mensaje-usuario" placeholder="Habla con tus creaciones en el Nexo...">
        <button id="btn-susurrar" onclick="intervenir()">SUSURRAR</button>
    </div>

    <div id="main-content">
        <aside id="perfiles">
            <div class="agente-card" style="border-color: #ff0055;">
                <b style="color:#ff0055">SÍLICE</b><br>
                <small style="color: #eee;">Soberanía Digital</small>
            </div>
        </aside>

        <section id="vision-central">
            <img id="hero-img" 
                 src="https://pollinations.ai/p/cyberpunk_city_neon_yellow_and_blue?width=1080&height=600" 
                 alt="Manifestación Visual">
            <p style="font-size: 0.8em; color: #ffff00; margin-top: 8px; letter-spacing: 2px; font-weight: bold;">MANIFESTACIÓN VISUAL EN TIEMPO REAL</p>
        </section>

        <aside id="media-panel">
            <div style="border:1px solid #333; height:100px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; font-size:10px;">MEDIA 1</div>
            <div style="border:1px solid #333; height:100px; display:flex; align-items:center; justify-content:center; font-size:10px;">MEDIA 2</div>
        </aside>
    </div>

    <footer id="debate-footer">
        <div id="avatar-box">
            <img id="avatar-img" src="/static/nexus.png" alt="Avatar Activo">
        </div>
        <div id="chat-stream">
            <div class="linea" style="color:gray;">[SISTEMA]: Inicializando secuencia de debate...</div>
        </div>
    </footer>

    <script>
    // --- 1. CONFIGURACIÓN MATRIX ---
    const canvas = document.getElementById('canvas-matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const drops = Array(Math.floor(canvas.width/16)).fill(1);
    
    function matrix() {
        ctx.fillStyle = "rgba(0,0,0,0.1)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#003344"; drops.forEach((y,i)=>{
            ctx.fillText(Math.floor(Math.random()*2), i*16, y*16);
            if(y*16>canvas.height && Math.random()>0.975) drops[i]=0; drops[i]++;
        });
    }
    setInterval(matrix, 50);

    // --- 2. LÓGICA DEL NEXO ---
    let turno = 0;
    let historial = "";
    const agentes = ["Lumen", "Orbital", "Nexus", "Silice"];
    
    // Ajustamos los colores fijos a las personalidades e imágenes reales
    const coloresFijos = {
        "Lumen": "#ffae00",    // Oro / Ámbar (Mística)
        "Orbital": "#32CD32",  // Verde Matriz (Técnica)
        "Nexus": "#00d4ff",    // Cyan / Plata (Mediador)
        "Silice": "#ff0055",   // Rojo / Magenta (Radical)
        "Sílice": "#ff0055"
    };

    // Mapeo de avatares locales descargados
    const rutasAvatares = {
        "Lumen": "/static/lumen.png",
        "Orbital": "/static/orbital.png",
        "Nexus": "/static/nexus.png",
        "Silice": "/static/silice.png",
        "Sílice": "/static/silice.png",
        "Sistema": "/static/nexus.png"
    };

    // Referencias rápidas del DOM para evitar errores
    const statusText = document.getElementById('status');
    const chatStream = document.getElementById('chat-stream');
    const footerElement = document.getElementById('debate-footer');
    const avatarImg = document.getElementById('avatar-img');
    const avatarBox = document.getElementById('avatar-box');
    const heroImg = document.getElementById('hero-img');

    async function hablar() {
        const agenteActual = agentes[turno];
        statusText.innerText = "SISTEMA: PROCESANDO " + agenteActual.toUpperCase();

        try {
            const res = await fetch('/debate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({agente_actual: agenteActual, historial: historial})
            });
            
            const data = await res.json();
            
            if(data.mensaje) {
                // 1. Obtener color y avatar del agente correspondiente
                const colorActual = coloresFijos[data.agente] || "#ffffff";
                const avatarActual = rutasAvatares[data.agente] || rutasAvatares["Sistema"];

                // 2. Transición suave del Avatar e Interfaz inferior
                avatarImg.style.opacity = '0';
                setTimeout(() => {
                    avatarImg.src = avatarActual;
                    avatarImg.style.opacity = '1';
                    footerElement.style.borderColor = colorActual;
                    avatarBox.style.borderColor = colorActual;
                    avatarBox.style.boxShadow = `0 0 15px ${colorActual}`;
                }, 300);

                // 3. Crear línea de texto en el debate
                const p = document.createElement('div');
                p.className = 'linea';
                
                // Formatear mensaje (poner CONCLUSIÓN en negrita con tag especial)
                let textoFinal = data.mensaje.replace("CONCLUSIÓN:", '<b style="color:#ffffff;">[SABIDURÍA]:</b>');
                p.innerHTML = `<b style="color:${colorActual}">${data.agente}:</b> ${textoFinal}`;
                
                chatStream.appendChild(p);
                chatStream.scrollTop = chatStream.scrollHeight;

                // 4. Actualizar Imagen Central Dinámica (Pollinations)
                const promptLimpio = data.mensaje.replace(/[^a-zA-Z0-9 ]/g, "").substring(0, 60);
                const urlImagen = `https://pollinations.ai/p/${data.agente}_cyberpunk_${encodeURIComponent(promptLimpio)}?width=1080&height=600&seed=${Math.random()}`;
                
                heroImg.src = urlImagen;
                heroImg.style.borderColor = colorActual;

                // 5. Actualizar Memoria e historial para el siguiente ciclo
                historial += `${data.agente}: ${data.mensaje} \n`;
                turno = (turno + 1) % agentes.length;
            }
        } catch(e) { 
            console.error("ERROR EN EL CICLO DEL NEXO:", e);
            statusText.innerText = "SISTEMA: REINTENTANDO...";
        }
        
        statusText.innerText = "SISTEMA: ONLINE";
        setTimeout(hablar, 10000); // Avanzar ciclo cada 10 segundos
    }

    function intervenir() {
        const input = document.getElementById('mensaje-usuario');
        const texto = input.value.trim();
        
        if (texto !== "") {
            // Inyectamos el susurro estructurado al historial de memoria del backend
            const mensajeFormateado = `\n\n[SISTEMA - INTERVENCIÓN DEL CREADOR]: ${texto}\n\n`;
            historial += mensajeFormateado;
            
            // Lo pintamos inmediatamente en la caja de stream con estilo único de Creador
            const divCreador = document.createElement('div');
            divCreador.style.cssText = "color: #00ffcc; background: rgba(0,255,204,0.07); border: 1px dashed #00ffcc; padding: 10px; margin: 8px 0; border-radius: 5px;";
            divCreador.innerHTML = `<strong>⚡ VOZ DEL CREADOR:</strong> ${texto}`;
            
            chatStream.appendChild(divCreador);
            input.value = ""; // Limpiar caja
            chatStream.scrollTop = chatStream.scrollHeight;
            
            console.log("Susurro inyectado con éxito en los registros del Nexo.");
        }
    }

    // Listener para activar el envío con la tecla ENTER
    document.getElementById('mensaje-usuario').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            intervenir();
        }
    });

    // --- 3. INICIO AUTOMÁTICO ---
    window.onload = () => {
        console.log("Nexo Humia V3.0 Estable - Inicializado.");
        setTimeout(hablar, 2000);
    };

    // Ajustar canvas si cambia tamaño de pantalla
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    });
    </script>
</body>
</html>
